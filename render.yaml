services:
  - type: web
    name: munshi
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma db execute --file prisma/cleanup-payments.sql --schema prisma/schema.prisma && npx prisma db push --skip-generate && npm run db:seed && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: munshi-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: VOICE_TOOL_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_SETUP_AGENT_ID
        sync: false
      - key: ELEVENLABS_ORDER_AGENT_ID
        sync: false
      - key: ELEVENLABS_WEBHOOK_SECRET
        sync: false
      - key: AGENTICORG_API_KEY
        sync: false
      - key: AGENTICORG_COMPANY_ID
        sync: false
      - key: AGENTICORG_ONBOARDING_AGENT_ID
        sync: false
      - key: AGENTICORG_CATALOG_AGENT_ID
        sync: false
      - key: AGENTICORG_ORDER_AGENT_ID
        sync: false
      - key: VOBIZ_AUTH_ID
        sync: false
      - key: VOBIZ_AUTH_TOKEN
        sync: false
      - key: VOBIZ_SMS_FROM
        sync: false
      - key: MUNSHI_PHONE_NUMBER
        sync: false

databases:
  - name: munshi-db
    plan: free
    databaseName: munshi
